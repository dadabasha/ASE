spring.application.name=application-support-activity-tracker

# Supabase is a hosted PostgreSQL database. Use the Session Pooler JDBC URL when
# your network needs IPv4 support:
# jdbc:postgresql://aws-0-[region].pooler.supabase.com:5432/postgres?user=postgres.[project-ref]&password=[password]&sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false
server.error.include-message=always
server.port=${PORT:8080}
