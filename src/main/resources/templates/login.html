<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support Activity Tracker Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-copy">
                <div class="brand-mark">AS</div>
                <p class="eyebrow">Application Support</p>
                <h1>Daily Activity Tracker</h1>
                <p class="muted">Record health checks, ticket movement, backup status, escalations, and handover remarks in one operational view.</p>
                <div class="login-metrics">
                    <span>Health</span>
                    <span>Tickets</span>
                    <span>Backups</span>
                    <span>Reports</span>
                </div>
            </div>
            <form id="loginForm" class="login-card">
                <div class="form-title">
                    <span class="dot"></span>
                    <h2>Sign in</h2>
                </div>
                <div class="alert alert-danger d-none" id="loginError"></div>
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
                <label class="form-label mt-3" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="btn btn-primary w-100 mt-4" type="submit">Login</button>
                <div class="sample-logins">
                    <span>Admin: admin / admin123</span>
                    <span>Engineer: engineer / engineer123</span>
                </div>
            </form>
        </section>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const error = document.getElementById('loginError');
            error.classList.add('d-none');
            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                location.href = '/dashboard';
                return;
            }
            const body = await response.json();
            error.textContent = body.message || 'Unable to login';
            error.classList.remove('d-none');
        });
    </script>
</body>
</html>
